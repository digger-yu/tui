name: Translation selftest

on:
  push:
    branches: [fix/translation]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests python-dotenv
      - name: Translate samples
        env:
          TRANSLATOR_ENGINE: auto
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s %(message)s")
          import translator as t

          samples = [
              "$CRWV bankers are preparing a $4.5B loan sale, secured by GPUs for its $META contract. Initial pricing is expected tomorrow. Thoughts?",
              "Bitcoin just hit a new all-time high, and ETF inflows keep growing.",
              "GM",
              "https://example.com/a?b=1",
          ]
          failed = 0
          for s in samples:
              r = t.translate_tweet(s)
              print("SRC:", s[:60])
              print("OUT:", r["ok"], r["engine"], "|", r["translated"][:120])
              print("-" * 40)
              if s.startswith("$CRWV") or s.startswith("Bitcoin"):
                  if not (r["ok"] and t.looks_chinese(r["translated"])):
                      failed += 1
          print("FAILED:", failed)
          raise SystemExit(1 if failed else 0)
          PY
