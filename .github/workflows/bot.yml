name: Twitter to Feishu Bot

on:
  # 每 15 分钟运行一次
  schedule:
    - cron: '*/15 * * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: run-bot
      cancel-in-progress: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # 允许 workflow 提交更改回仓库
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install system dependencies for Chromium + xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2 \
          libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
          libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
          libgtk-3-0t64 libxshmfence1

    - name: Cache patchright browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-patchright-chromium

    - name: Install patchright browser
      run: python -m patchright install chromium
    
    - name: Run bot
      env:
        # ==========================================
        # 通过 GitHub Secrets 注入凭证（公开项目，保护敏感信息）
        # ==========================================

        # 多账户配置 (JSON 格式)
        # 格式: [{"twitter_user": "用户名", "send_mode": "webhook", "phones": ["手机号"]}]
        # send_mode: "webhook" 发到群(需配 FEISHU_WEBHOOK_URL, 不需要 phones)
        # send_mode: "api" 私聊(需配 APP_ID/APP_SECRET 和 phones)
        ACCOUNTS_JSON: '[{"twitter_user": "aleabitoreddit", "send_mode": "webhook"}]'

        # 飞书群机器人 Webhook URL（用于群消息，不需要 APP_ID/APP_SECRET）
        # 通过 Settings → Secrets and variables → Actions 添加 FEISHU_WEBHOOK_URL
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

        # 如需使用应用 API 私聊方式（而非 Webhook 群消息），取消下面两行注释
        # 并在仓库 Settings → Secrets and variables → Actions 中添加 FEISHU_APP_ID / FEISHU_APP_SECRET
        # FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        # FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        # 示例:
        # FEISHU_APP_ID: 'cli_xxxxxxxxxxxxxxxx'
        # FEISHU_APP_SECRET: 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'

        # 可选配置
        TWEETS_COUNT: '1'
        TRANSLATOR_ENGINE: 'google'

        # 标记 GitHub Actions 环境
        GITHUB_ACTIONS: "true"
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py
    
    - name: Commit processed tweets
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 确保文件存在再添加（第一次运行可能没有 processed_tweets.json）
        touch processed_tweets.json
        # 只提交 processed_tweets.json，bot.log 通过 artifact 保留
        git add -f processed_tweets.json
        git diff --cached --quiet || git commit -m "Update processed tweets [skip ci]"
        git push
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bot-logs
        path: bot.log
        retention-days: 7
