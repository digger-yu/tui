name: Twitter to Feishu Bot

on:
  # 每 15 分钟运行一次
  schedule:
    - cron: '*/15 * * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run bot
      env:
        # ==========================================
        # 直接配置（私人项目，明文即可，无需 GitHub Secrets）
        # ==========================================
        
        # 多账户配置 (JSON 格式)
        # 格式: [{"twitter_user": "用户名", "phones": ["手机号1", "手机号2"]}]
        ACCOUNTS_JSON: '[{"twitter_user":"aleabitoreddit","phones":["13xxxxxxxxx","18201375969"]}]'
        
        # 飞书群机器人 Webhook URL（用于群消息，不需要 APP_ID/APP_SECRET）
        # 获取方式：飞书群设置 → 添加机器人 → 自定义机器人 → 复制 Webhook 地址
        FEISHU_WEBHOOK_URL: 'https://open.feishu.cn/open-apis/bot/v2/hook/REDACTED'
        
        # 如需使用应用 API 私聊方式（而非 Webhook 群消息），取消下面两行注释并填写：
        # FEISHU_APP_ID: 'cli_xxxxxxxxxxxxxxxx'
        # FEISHU_APP_SECRET: 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
        
        # 可选配置
        TWEETS_COUNT: '1'
        TRANSLATOR_ENGINE: 'google'
        
        # 标记 GitHub Actions 环境
        GITHUB_ACTIONS: "true"
      run: python main.py
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bot-logs
        path: bot.log
        retention-days: 7
