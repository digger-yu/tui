name: Twitter to Feishu Bot

on:
  # 每 15 分钟运行一次
  schedule:
    - cron: '*/15 * * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # 允许 workflow 提交更改回仓库
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run bot
      env:
        # ==========================================
        # 直接配置（私人项目，明文即可，无需 GitHub Secrets）
        # ==========================================
        
        # 多账户配置 (JSON 格式)
        # 格式: [{"twitter_user": "用户名", "send_mode": "webhook", "phones": ["手机号"]}]
        # send_mode: "webhook" 发到群(需配 FEISHU_WEBHOOK_URL, 不需要 phones)
        # send_mode: "api" 私聊(需配 APP_ID/APP_SECRET 和 phones)
        ACCOUNTS_JSON: '[{"twitter_user": "aleabitoreddit", "send_mode": "webhook"}]'
        
        # 飞书群机器人 Webhook URL（用于群消息，不需要 APP_ID/APP_SECRET）
        # 获取方式：飞书群设置 → 添加机器人 → 自定义机器人 → 复制 Webhook 地址
        FEISHU_WEBHOOK_URL: 'https://open.feishu.cn/open-apis/bot/v2/hook/REDACTED'
        
        # 如需使用应用 API 私聊方式（而非 Webhook 群消息），取消下面两行注释并填写：
        FEISHU_APP_ID: 'cli_REDACTED_APP_ID'
        FEISHU_APP_SECRET: 'REDACTED_APP_SECRET'
        
        # 可选配置
        TWEETS_COUNT: '1'
        TRANSLATOR_ENGINE: 'google'
        
        # 标记 GitHub Actions 环境
        GITHUB_ACTIONS: "true"
      run: python main.py
    
    - name: Commit processed tweets
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 确保文件存在再添加（第一次运行可能没有 processed_tweets.json）
        touch processed_tweets.json
        # 用 -f 强制添加（文件在 .gitignore 中）
        git add -f processed_tweets.json bot.log
        git diff --cached --quiet || git commit -m "Update processed tweets [skip ci]"
        git push
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bot-logs
        path: bot.log
        retention-days: 7
